name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag (leave blank to auto-generate)"
        type: string
        required: false
        default: ""
      release_name:
        description: "GitHub Release title (leave blank to auto-generate)"
        type: string
        required: false
        default: ""
      release_mode:
        description: "GitHub Release publish mode"
        type: choice
        required: true
        default: "published"
        options:
          - published
          - prerelease
          - draft
      run_tests:
        description: "Run Unit & Robolectric tests before building"
        type: choice
        required: true
        default: "enable"
        options:
          - enable
          - disable

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Test, Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK Platform 36.1 & Build-Tools 36.0.0
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          set -o pipefail
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0"

      - name: Check prebuilt libffmpeg.so binaries
        id: check-ffmpeg
        run: |
          if [ -f "app/src/main/jniLibs/arm64-v8a/libffmpeg.so" ] && \
             [ -f "app/src/main/jniLibs/armeabi-v7a/libffmpeg.so" ] && \
             [ -f "app/src/main/jniLibs/x86_64/libffmpeg.so" ] && \
             [ -f "app/src/main/jniLibs/x86/libffmpeg.so" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache compiled libffmpeg.so (when not committed)
        if: steps.check-ffmpeg.outputs.present != 'true'
        id: cache-ffmpeg-libs
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: libffmpeg-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**') }}

      - name: Build libffmpeg.so on cache miss
        if: steps.check-ffmpeg.outputs.present != 'true' && steps.cache-ffmpeg-libs.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          WORK_DIR: /tmp/native_build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl xz-utils tar bzip2 python3 binutils make file pkg-config
          if [ ! -d "${ANDROID_HOME}/ndk/28.2.13676358" ]; then
            sdkmanager --install "ndk;28.2.13676358"
          fi
          chmod +x app/src/main/cpp/build_libffmpeg.sh
          bash app/src/main/cpp/build_libffmpeg.sh

      - name: Setup Gradle 9.3.1 with Build & Dependency Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      - name: Restore debug.keystore from base64
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit & Robolectric Tests
        if: ${{ inputs.run_tests == 'enable' }}
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build Signed Release APK (when release signing secrets exist)
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare Release APKs & Metadata
        id: release-meta
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/debug/*.apk release_apks/
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            cp app/build/outputs/apk/release/*.apk release_apks/
          fi
          ls -lh release_apks/

          VERSION_NAME="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          VERSION_NAME="${VERSION_NAME:-1.0}"
          TAG="${INPUT_RELEASE_TAG:-v${VERSION_NAME}-build.${{ github.run_number }}}"
          NAME="${INPUT_RELEASE_NAME:-Voice Recorder v${VERSION_NAME} (Build #${{ github.run_number }})}"

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-meta.outputs.tag_name }}
          name: ${{ steps.release-meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          files: release_apks/*.apk
          fail_on_unmatched_files: true
          draft: ${{ inputs.release_mode == 'draft' }}
          prerelease: ${{ inputs.release_mode == 'prerelease' }}
          generate_release_notes: true
