name: Build MP3-Only FFmpeg (libffmpeg.so)

on:
  workflow_dispatch:
    inputs:
      target_abi:
        description: "Target ABI(s) to build"
        type: choice
        required: true
        default: "all"
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86
          - 64-bit
          - 32-bit
      verify_symbols:
        description: "Check JNI symbols & ELF headers"
        type: choice
        required: true
        default: "enable"
        options:
          - enable
          - disable

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve ABI Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Compute target ABI matrix
        id: set-matrix
        env:
          TARGET_ABI: ${{ inputs.target_abi }}
        run: |
          case "$TARGET_ABI" in
            all)
              MATRIX='{"include":[{"abi":"arm64-v8a","arch_bits":"64-bit"},{"abi":"armeabi-v7a","arch_bits":"32-bit"},{"abi":"x86_64","arch_bits":"64-bit"},{"abi":"x86","arch_bits":"32-bit"}]}'
              ;;
            64-bit)
              MATRIX='{"include":[{"abi":"arm64-v8a","arch_bits":"64-bit"},{"abi":"x86_64","arch_bits":"64-bit"}]}'
              ;;
            32-bit)
              MATRIX='{"include":[{"abi":"armeabi-v7a","arch_bits":"32-bit"},{"abi":"x86","arch_bits":"32-bit"}]}'
              ;;
            arm64-v8a)
              MATRIX='{"include":[{"abi":"arm64-v8a","arch_bits":"64-bit"}]}'
              ;;
            armeabi-v7a)
              MATRIX='{"include":[{"abi":"armeabi-v7a","arch_bits":"32-bit"}]}'
              ;;
            x86_64)
              MATRIX='{"include":[{"abi":"x86_64","arch_bits":"64-bit"}]}'
              ;;
            x86)
              MATRIX='{"include":[{"abi":"x86","arch_bits":"32-bit"}]}'
              ;;
            *)
              echo "Unsupported target_abi: $TARGET_ABI" >&2
              exit 1
              ;;
          esac
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-libffmpeg:
    name: Build libffmpeg.so (${{ matrix.abi }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install host build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl xz-utils tar bzip2 python3 binutils make file pkg-config autotools-dev

      - name: Setup JDK 17 (required by sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Detect preinstalled Android SDK
        id: detect-sdk
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK_ROOT" ]; then
            echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
            [ -d "$SDK_ROOT/cmdline-tools/latest/bin" ] && echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            [ -d "$SDK_ROOT/platform-tools" ] && echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          fi
          if command -v sdkmanager >/dev/null 2>&1 || [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "has_sdkmanager=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sdkmanager=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Android SDK (fallback when missing)
        if: steps.detect-sdk.outputs.has_sdkmanager != 'true'
        uses: android-actions/setup-android@v3

      - name: Cache Android NDK r28c
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: android-ndk-28.2.13676358-linux

      - name: Install Android NDK 28.2.13676358
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          set +o pipefail
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          if [ ! -d "${SDK_ROOT}/ndk/28.2.13676358" ]; then
            yes | sdkmanager --sdk_root="$SDK_ROOT" --install "ndk;28.2.13676358"
          fi
          set -o pipefail

      - name: Cache FFmpeg & LAME source tarballs
        uses: actions/cache@v4
        with:
          path: /tmp/native_build/downloads
          key: ffmpeg-6.1.2-lame-3.100-sources-v2

      - name: Build MP3-only libffmpeg.so (${{ matrix.abi }} / ${{ matrix.arch_bits }})
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          WORK_DIR: /tmp/native_build
          TARGET_ABIS: ${{ matrix.abi }}
        run: |
          chmod +x app/src/main/cpp/build_libffmpeg.sh
          bash app/src/main/cpp/build_libffmpeg.sh

      - name: Verify ELF binary & JNI symbols
        if: ${{ inputs.verify_symbols == 'enable' }}
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SO_PATH="app/src/main/jniLibs/${{ matrix.abi }}/libffmpeg.so"
          test -f "$SO_PATH"
          file "$SO_PATH"
          readelf -d "$SO_PATH" | grep -E "SONAME|NEEDED"
          "${SDK_ROOT}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D "$SO_PATH" | grep "Java_com_android_abdullah_voicerecorder_mp3_audio_FfmpegMp3Native"

      - name: Stage libffmpeg.so with ABI folder
        run: |
          mkdir -p "artifact_out/${{ matrix.abi }}"
          cp "app/src/main/jniLibs/${{ matrix.abi }}/libffmpeg.so" "artifact_out/${{ matrix.abi }}/libffmpeg.so"

      - name: Upload libffmpeg.so (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: libffmpeg-${{ matrix.abi }}
          path: artifact_out
          if-no-files-found: error
          retention-days: 30

  package-libffmpeg:
    name: Bundle selected libffmpeg.so binaries
    needs: build-libffmpeg
    runs-on: ubuntu-latest
    steps:
      - name: Download built libffmpeg.so binaries
        uses: actions/download-artifact@v4
        with:
          pattern: libffmpeg-*
          path: jniLibs
          merge-multiple: true

      - name: Verify bundled ABI binaries
        run: ls -lh jniLibs/*/libffmpeg.so

      - name: Upload combined libffmpeg bundle
        uses: actions/upload-artifact@v4
        with:
          name: libffmpeg-bundle-${{ inputs.target_abi }}
          path: jniLibs/**/libffmpeg.so
          if-no-files-found: error
          retention-days: 30
