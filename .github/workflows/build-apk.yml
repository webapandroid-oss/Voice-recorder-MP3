name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag (leave blank to auto-generate)"
        type: string
        required: false
        default: ""
      release_name:
        description: "GitHub Release title (leave blank to auto-generate)"
        type: string
        required: false
        default: ""
      release_mode:
        description: "GitHub Release publish mode"
        type: choice
        required: true
        default: "published"
        options:
          - published
          - prerelease
          - draft
      run_tests:
        description: "Run Unit & Robolectric tests before building"
        type: choice
        required: true
        default: "enable"
        options:
          - enable
          - disable

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Test, Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Detect preinstalled Android SDK
        id: detect-sdk
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK_ROOT" ]; then
            echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
            [ -d "$SDK_ROOT/cmdline-tools/latest/bin" ] && echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            [ -d "$SDK_ROOT/platform-tools" ] && echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          fi
          if command -v sdkmanager >/dev/null 2>&1 || [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "has_sdkmanager=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sdkmanager=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Android SDK (fallback when missing)
        if: steps.detect-sdk.outputs.has_sdkmanager != 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Ensure Android SDK Platform 36 & Build-Tools 36.0.0
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          MISSING_PACKAGES=()
          [ ! -d "$SDK_ROOT/platform-tools" ] && MISSING_PACKAGES+=("platform-tools")
          [ ! -d "$SDK_ROOT/platforms/android-36" ] && MISSING_PACKAGES+=("platforms;android-36")
          [ ! -d "$SDK_ROOT/build-tools/36.0.0" ] && MISSING_PACKAGES+=("build-tools;36.0.0")

          if [ ${#MISSING_PACKAGES[@]} -gt 0 ] || [ ! -d "$SDK_ROOT/platforms/android-36.1" ] || [ ! -f "$SDK_ROOT/licenses/android-sdk-license" ]; then
            set +o pipefail
            yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            set -o pipefail
          fi

          if [ ${#MISSING_PACKAGES[@]} -gt 0 ]; then
            echo "Installing missing required SDK packages: ${MISSING_PACKAGES[*]}"
            set +o pipefail
            yes | sdkmanager --sdk_root="$SDK_ROOT" --install "${MISSING_PACKAGES[@]}"
            set -o pipefail
          fi

          if [ ! -d "$SDK_ROOT/platforms/android-36.1" ]; then
            echo "Checking/installing platforms;android-36.1..."
            set +o pipefail
            yes | sdkmanager --sdk_root="$SDK_ROOT" --install "platforms;android-36.1" || true
            set -o pipefail
          fi

      - name: Check prebuilt libffmpeg.so binaries
        id: check-ffmpeg
        run: |
          if [ -f "app/src/main/jniLibs/arm64-v8a/libffmpeg.so" ] && \
             [ -f "app/src/main/jniLibs/armeabi-v7a/libffmpeg.so" ] && \
             [ -f "app/src/main/jniLibs/x86_64/libffmpeg.so" ] && \
             [ -f "app/src/main/jniLibs/x86/libffmpeg.so" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache compiled libffmpeg.so (when not committed)
        if: steps.check-ffmpeg.outputs.present != 'true'
        id: cache-ffmpeg-libs
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: libffmpeg-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**') }}

      - name: Build libffmpeg.so on cache miss
        if: steps.check-ffmpeg.outputs.present != 'true' && steps.cache-ffmpeg-libs.outputs.cache-hit != 'true'
        env:
          WORK_DIR: /tmp/native_build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl xz-utils tar bzip2 python3 binutils make file pkg-config autotools-dev
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="${SDK_ROOT}/ndk/28.2.13676358"
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            set +o pipefail
            yes | sdkmanager --sdk_root="$SDK_ROOT" --install "ndk;28.2.13676358"
            set -o pipefail
          fi
          chmod +x app/src/main/cpp/build_libffmpeg.sh
          bash app/src/main/cpp/build_libffmpeg.sh

      - name: Setup Gradle 9.3.1 with Build & Dependency Caching
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-provider: basic
          cache-read-only: false

      - name: Cache Robolectric Android Runtime JARs
        if: ${{ inputs.run_tests == 'enable' }}
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/**') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Restore debug.keystore from base64
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            tr -d ' \t\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          fi

      - name: Run Unit & Robolectric Tests
        if: ${{ inputs.run_tests == 'enable' }}
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build Signed Release APK (when release signing secrets exist)
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$KEYSTORE_PATH"
          gradle :app:assembleRelease --stacktrace

      - name: Prepare Release APKs & Metadata
        id: release-meta
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/debug/*.apk release_apks/
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            cp app/build/outputs/apk/release/*.apk release_apks/
          fi
          ls -lh release_apks/

          VERSION_NAME="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          VERSION_NAME="${VERSION_NAME:-1.0}"
          CLEAN_TAG="$(printf '%s' "$INPUT_RELEASE_TAG" | xargs || true)"
          CLEAN_NAME="$(printf '%s' "$INPUT_RELEASE_NAME" | xargs || true)"
          TAG="${CLEAN_TAG:-v${VERSION_NAME}-build.${{ github.run_number }}}"
          NAME="${CLEAN_NAME:-Voice Recorder v${VERSION_NAME} (Build #${{ github.run_number }})}"

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-recorder-apks-${{ github.run_number }}
          path: release_apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release-meta.outputs.tag_name }}
          name: ${{ steps.release-meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          files: release_apks/*.apk
          fail_on_unmatched_files: true
          draft: ${{ inputs.release_mode == 'draft' }}
          prerelease: ${{ inputs.release_mode == 'prerelease' }}
          generate_release_notes: true
